<style>
/* FixGHL booking widget skin. Colours, fonts, borders, radius and spacing only: no layout changes. */

}

#appointment_widgets--revamp .custom-form-title {

  color: #08080A !important;
}

#appointment_widgets--revamp .vdpPeriodControl > button {

}

}

#appointment_widgets--revamp .arrowNext:hover { border-color: #08080A !important; }

#appointment_widgets--revamp .vdpCell.selected:hover .vdpCellContent { background: #08080A !important; color: #FFFFFF !important; }

/* Time slots: the time is the span; "Select" appears beside the chosen time */

  background: #FFFFFF !important;
  border: 1px solid #ECE9E4 !important;
  border-radius: 999px !important;
  color: #08080A !important;
  font-size: 15px !important;
  font-weight: 600 !important;
  font-variant-numeric: tabular-nums;
  box-shadow: none !important;

}
#appointment_widgets--revamp .widgets-time-slot:hover > span { border-color: #08080A !important; }
#appointment_widgets--revamp .widgets-time-slot.actived > span {
  background: #08080A !important;
  border-color: #08080A !important;
  color: #FFFFFF !important;
}
#appointment_widgets--revamp .widgets-time-slot .selected-slot {
  background: #FFFFFF !important;
  border: 1px solid #08080A !important;
  border-radius: 999px !important;
  color: #08080A !important;
  font-size: 15px !important;
  font-weight: 600 !important;
  box-shadow: none !important;

}

/* Fields: text, email, textarea, dropdowns */

#appointment_widgets--revamp .multiselect__tags {
  background: #FFFFFF !important;
  border: 1px solid #ECE9E4 !important;
  border-radius: 14px !important;
  color: #08080A !important;
  box-shadow: none !important;
  transition: border-color .16s ease, box-shadow .16s ease;
}
#appointment_widgets--revamp .form-control { font-size: 16px !important; }

#appointment_widgets--revamp .multiselect:hover .multiselect__tags { border-color: #A8A59F !important; }

#appointment_widgets--revamp .multiselect--active .multiselect__tags {
  border-color: #08080A !important;
  box-shadow: 0 0 0 4px rgba(255, 222, 89, .55) !important;
  outline: none !important;
}
#appointment_widgets--revamp .form-control::placeholder,
#appointment_widgets--revamp .multiselect__placeholder,
#appointment_widgets--revamp .multiselect__input::placeholder { color: #7F7C76 !important; }
#appointment_widgets--revamp .multiselect__single { color: #08080A !important; }
#appointment_widgets--revamp label,
#appointment_widgets--revamp .field-label { color: #08080A !important; font-size: 14px !important; font-weight: 600 !important; }

/* Dropdown lists */
#appointment_widgets--revamp .multiselect__content-wrapper,
#teleports .multiselect__content-wrapper {
  background: #FFFFFF !important;
  border: 1px solid #ECE9E4 !important;
  border-radius: 14px !important;
  box-shadow: none !important;
}
#appointment_widgets--revamp .multiselect__option,
#teleports .multiselect__option { color: #08080A !important; font-size: 14px !important; }

#teleports .multiselect__option--highlight { background: #F4F3F1 !important; color: #08080A !important; }

#teleports .multiselect__option--selected { background: #08080A !important; color: #FFFFFF !important; font-weight: 600 !important; }
#appointment_widgets--revamp .multiselect__option::after,
#teleports .multiselect__option::after { display: none !important; }

/* Buttons */
#appointment_widgets--revamp .hl_button,
#appointment_widgets--revamp .btn-schedule {
  background: #08080A !important;
  border: 1px solid #08080A !important;
  border-radius: 999px !important;
  color: #FFFFFF !important;
  box-shadow: none !important;
  transition: background-color .16s ease;
}
#appointment_widgets--revamp .hl_button:hover,
#appointment_widgets--revamp .btn-schedule:hover { background: #2E2C29 !important; border-color: #2E2C29 !important; }
#appointment_widgets--revamp .hl_button .button-text > div,
#appointment_widgets--revamp .btn-schedule { font-size: 15px !important; font-weight: 600 !important; }
#appointment_widgets--revamp .hl_button .button-text > div::after,
#appointment_widgets--revamp .btn-schedule::after { content: "\2192"; margin-left: 6px; }
#appointment_widgets--revamp .appointment_widgets--revamp--back-button {
  background: #FFFFFF !important;
  border: 1px solid #ECE9E4 !important;
  border-radius: 999px !important;
  box-shadow: none !important;
  color: #08080A !important;
}
#appointment_widgets--revamp .appointment_widgets--revamp--back-button:hover { border-color: #08080A !important; }

/* Keyboard focus: gold ring on everything clickable */
#appointment_widgets--revamp button:focus-visible,
#appointment_widgets--revamp .vdpCell:focus-visible .vdpCellContent {
  outline: none !important;
  box-shadow: var(--fx-ring) !important;
}
#appointment_widgets--revamp .multiselect:focus,
#appointment_widgets--revamp .multiselect__input:focus { outline: none !important; box-shadow: none !important; }

/* Approved layout exceptions (2):
   1. On phones, keep the "What do you need?" list inside the field. */
@media (max-width: 640px) {
  #appointment_widgets--revamp .multi_select_form .multiselect__content-wrapper {
    max-width: 100% !important;
    box-sizing: border-box !important;
  }
}
/* 2. No height cap on the details step: the whole form shows and the page embed grows to fit. */
#appointment_widgets--revamp .appointment_widgets--revamp--steps.step-form { max-height: none !important; }
/* Approved fixes (details step):
   3. "Confirm my call" sits 24px below the last field, as wide as the fields. GHL pins the button row to the
      card's bottom edge, so the step reserves room for the 24px gap, the 52px button and 32px below it,
      and the card may grow to hold it. */
#appointment_widgets--revamp .appointment_widgets--revamp--inner:has(.step-form) { height: auto !important; min-height: 0 !important; max-height: none !important; }

#appointment_widgets--revamp #_builder-form .payment-block,
#appointment_widgets--revamp #_builder-form .form-field-wrapper:has(.form-builder--btn-submit) { margin-bottom: 0 !important; }
#appointment_widgets--revamp #_builder-form .form-builder--btn-submit { margin-top: 0 !important; }
#appointment_widgets--revamp #_builder-form .fields-container,
#appointment_widgets--revamp #_builder-form.form-builder--wrap { padding-bottom: 0 !important; }
#appointment_widgets--revamp .appointment_widgets--revamp--steps.step-form { padding-bottom: 85px !important; }
#appointment_widgets--revamp .appointment_widgets--revamp--booking:has(.step-form) > .widgets-action-buttons { width: auto !important; padding-left: 0 !important; padding-right: 0 !important; bottom: 32px !important; }

#appointment_widgets--revamp.appointment_widgets-lg--revamp .appointment_widgets--revamp--booking:has(.step-form) > .widgets-action-buttons,
#appointment_widgets--revamp.appointment_widgets-xl--revamp .appointment_widgets--revamp--booking:has(.step-form) > .widgets-action-buttons { left: 151px !important; right: 141px !important; }
#appointment_widgets--revamp .widgets-action-buttons .btn-schedule {
  width: 100% !important;
  height: 52px !important;
  justify-content: center !important;
}

/* 4. "What do you need?" is 52px tall like the other fields, text centred. */
#appointment_widgets--revamp #_builder-form .multi_select_form,
#appointment_widgets--revamp #_builder-form .multi_select_form .multiselect__tags { min-height: 52px !important; }
#appointment_widgets--revamp #_builder-form .multi_select_form .multiselect__tags {
  height: 52px !important;
  box-sizing: border-box !important;
  padding: 13px 44px 13px 20px !important;
}
#appointment_widgets--revamp #_builder-form .multi_select_form .multiselect__placeholder,
#appointment_widgets--revamp #_builder-form .multi_select_form .multiselect__single,
#appointment_widgets--revamp #_builder-form .multi_select_form .multiselect__input {
  font-size: 16px !important;
  line-height: 24px !important;
  min-height: 24px !important;
  margin: 0 !important;
  padding: 0 !important;
  text-indent: 0 !important;
}
#appointment_widgets--revamp #_builder-form .multi_select_form .multiselect__placeholder { color: #7F7C76 !important; }
#appointment_widgets--revamp #_builder-form .multi_select_form .multiselect__single {
  color: #08080A !important;
  max-width: 100% !important;
  white-space: nowrap !important;

  text-overflow: ellipsis !important;
  vertical-align: top !important;
}
#appointment_widgets--revamp #_builder-form .multi_select_form .multiselect__select { height: 50px !important; }
/* 5. Details step header: back arrow and "Enter details" on one row, 24px from the card top, heading's
      left edge on the field edge, arrow just left of it. */
#appointment_widgets--revamp .appointment_widgets--revamp--container:has(.step-form) .appointment_widgets--revamp--navigation-container { padding-top: 23px !important; }
#appointment_widgets--revamp .appointment_widgets--revamp--container:has(.step-form) .appointment_widgets--revamp--back-button { position: relative; z-index: 2; }
#appointment_widgets--revamp .appointment_widgets--revamp--steps.step-form { margin-top: -35px !important; padding-top: 0 !important; }
#appointment_widgets--revamp.appointment_widgets-sm--revamp .appointment_widgets--revamp--container:has(.step-form) .appointment_widgets--revamp--navigation-container { padding-left: 3px !important; }
#appointment_widgets--revamp.appointment_widgets-md--revamp .appointment_widgets--revamp--container:has(.step-form) .appointment_widgets--revamp--navigation-container { padding-left: 29px !important; }
#appointment_widgets--revamp.appointment_widgets-lg--revamp .appointment_widgets--revamp--container:has(.step-form) .appointment_widgets--revamp--navigation-container,
#appointment_widgets--revamp.appointment_widgets-xl--revamp .appointment_widgets--revamp--container:has(.step-form) .appointment_widgets--revamp--navigation-container { padding-left: 99px !important; }
#appointment_widgets--revamp.appointment_widgets-sm--revamp .step-form .custom-form-title,
#appointment_widgets--revamp.appointment_widgets-lg--revamp .step-form .custom-form-title,
#appointment_widgets--revamp.appointment_widgets-xl--revamp .step-form .custom-form-title { padding-left: 41px !important; }
#appointment_widgets--revamp.appointment_widgets-md--revamp .step-form .custom-form-title { padding-left: 61px !important; }

/* 6. "What's going on?" box 110px tall. */
#appointment_widgets--revamp #_builder-form textarea.form-control { height: 110px !important; min-height: 110px !important; }
/* 7. Date & time step: 40px above "Select Date & Time", and 24px from the last row of dates to "Time zone".
      GHL always draws six week rows; when the last one is empty (no dates), the time zone block moves up
      over that blank row so the gap stays 24px in every month. */
#appointment_widgets--revamp:not(.appointment_widgets-sm--revamp) .appointment_widgets--revamp--steps:not(.step-form) { padding-top: 15px !important; }
#appointment_widgets--revamp .widgets-date-block .vdpInnerWrap { margin-bottom: 7px !important; }
#appointment_widgets--revamp .widgets-date-block .vdpInnerWrap:has(tbody tr:last-child > .vdpCell:first-child.outOfRange) { margin-bottom: -49px !important; }

  #appointment_widgets--revamp .widgets-date-block .vdpInnerWrap:has(tbody tr:last-child > .vdpCell:first-child.outOfRange) { margin-bottom: -45px !important; }
}
@media screen and (max-width: 450px) {
  #appointment_widgets--revamp .widgets-date-block .vdpInnerWrap:has(tbody tr:last-child > .vdpCell:first-child.outOfRange) { margin-bottom: -37px !important; }
}
</style>
